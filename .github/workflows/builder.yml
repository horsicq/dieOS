name: Build dieOS

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dieos-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential git squashfs-tools genisoimage xorriso curl debootstrap grub-pc-bin grub-efi-amd64-bin mtools

      - name: Compile CDiE
        run: |
          chmod +x build_cdie.sh
          ./build_cdie.sh

      - name: Build dieOS ISO
        run: |
          mkdir -p /tmp/ubuntu-rootfs /tmp/iso-work/boot/grub
          
          # 1. Bootstrap minimal Ubuntu Resolute
          sudo debootstrap --arch=amd64 resolute /tmp/ubuntu-rootfs http://archive.ubuntu.com/ubuntu/

          # 2. Copy compiled binary & database
          sudo mkdir -p /tmp/ubuntu-rootfs/usr/bin /tmp/ubuntu-rootfs/analysis
          sudo cp CDiE/build/src/console/cdie /tmp/ubuntu-rootfs/usr/bin/diec
          sudo chmod +x /tmp/ubuntu-rootfs/usr/bin/diec
          
          if [ -d "Detect-It-Easy/db" ]; then
            sudo cp -r Detect-It-Easy/db /tmp/ubuntu-rootfs/analysis/db
          fi

          # 3. Apply Overlay (copies all config files seamlessly into the OS!)
          sudo cp -a overlay/. /tmp/ubuntu-rootfs/

          # 4. Mount virtual filesystems & execute Chroot Script
          sudo mount --bind /dev /tmp/ubuntu-rootfs/dev
          sudo mount --bind /proc /tmp/ubuntu-rootfs/proc
          sudo mount --bind /sys /tmp/ubuntu-rootfs/sys

          sudo cp scripts/setup_chroot.sh /tmp/ubuntu-rootfs/setup_chroot.sh
          sudo chmod +x /tmp/ubuntu-rootfs/setup_chroot.sh
          sudo chroot /tmp/ubuntu-rootfs /setup_chroot.sh
          sudo rm /tmp/ubuntu-rootfs/setup_chroot.sh

          sudo umount /tmp/ubuntu-rootfs/dev
          sudo umount /tmp/ubuntu-rootfs/proc
          sudo umount /tmp/ubuntu-rootfs/sys

          # 5. Extract Kernel & Build Squashfs
          sudo cp /tmp/ubuntu-rootfs/boot/vmlinuz-* /tmp/iso-work/vmlinuz
          sudo cp /tmp/ubuntu-rootfs/boot/initrd.img-* /tmp/iso-work/initrd

          CPU_CORES=$(nproc)
          sudo mkdir -p /tmp/iso-work/casper
          sudo mksquashfs /tmp/ubuntu-rootfs /tmp/iso-work/casper/filesystem.squashfs -no-recovery -comp xz -Xbcj x86 -processors $CPU_CORES

          # 6. Generate ISO (Grub config was already copied via overlay)
          sudo cp overlay/boot/grub/grub.cfg /tmp/iso-work/boot/grub/grub.cfg
          sudo grub-mkrescue -o /tmp/dieOS_x86_64_resolute.iso /tmp/iso-work

      - name: Create GitHub Release and Upload ISO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Beta"
          name: "Beta"
          files: /tmp/dieOS_x86_64_resolute.iso
          draft: false
          prerelease: true